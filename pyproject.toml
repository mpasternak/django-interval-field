[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pgsql-interval-field"
version = "0.9.3"
description = "Support for PostgreSQL INTERVAL for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["django", "postgresql", "interval", "timedelta", "field"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = ["django>=4.2", "six"]

[project.urls]
Homepage = "https://github.com/mpasternak/django-interval-field"
Repository = "https://github.com/mpasternak/django-interval-field"
Issues = "https://github.com/mpasternak/django-interval-field/issues"

[tool.setuptools.packages.find]
include = ["interval*"]

[tool.setuptools.package-data]
interval = ["static/*.css", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]
