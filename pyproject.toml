[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-pgsql-interval-field"
dynamic = ["version"]
description = "Support for PostgreSQL INTERVAL for Django"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["django", "postgresql", "interval", "timedelta", "field"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = ["django>=4.2", "six"]

[project.optional-dependencies]
dev = ["pytest", "pytest-django"]

[project.urls]
Homepage = "https://github.com/mpasternak/django-interval-field"
Repository = "https://github.com/mpasternak/django-interval-field"
Issues = "https://github.com/mpasternak/django-interval-field/issues"

[tool.setuptools_scm]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_project.settings"
python_files = ["test_*.py", "tests.py"]
pythonpath = [".", "test_project"]
testpaths = ["interval", "test_project"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.setuptools.packages.find]
include = ["interval*"]

[tool.setuptools.package-data]
interval = ["static/*.css", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]
